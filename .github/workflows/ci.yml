name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    # macOS so the iOS targets compile alongside everything else.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run library tests (all targets)
        run: ./gradlew :library:allTests --stacktrace

      - name: Verify publishing (Maven local)
        run: ./gradlew :library:publishToMavenLocal --stacktrace

      - name: Build sample web distribution
        run: ./gradlew :sample:wasmJsBrowserDistribution --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: "**/build/reports/tests/**"
          if-no-files-found: ignore
